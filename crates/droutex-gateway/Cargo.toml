[package]
name = "droutex-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
experimental-tls = ["dep:tls-parser"]

[dependencies]
droutex-config.workspace = true
droutex-common.workspace = true
droutex-core = { path = "../droutex-core", version = "=0.1.0" }
droutex-policy.workspace = true
hickory-proto.workspace = true
serde_json.workspace = true
tls-parser = { version = "=0.12.2", default-features = false, optional = true }
tokio = { workspace = true, features = ["net", "io-util", "macros"] }

[dev-dependencies]
droutex-security.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
