[package]
name = "droutex-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
experimental-smartdns = ["dep:droutex-gateway", "droutex-gateway/experimental-tls"]

[dependencies]
droutex-common.workspace = true
droutex-config.workspace = true
droutex-core = { path = "../droutex-core", version = "=0.1.0" }
droutex-gateway = { path = "../droutex-gateway", version = "=0.1.0", optional = true }
droutex-policy.workspace = true
hickory-proto.workspace = true
hickory-net.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros"] }

[dev-dependencies]
droutex-security.workspace = true

[lints]
workspace = true
