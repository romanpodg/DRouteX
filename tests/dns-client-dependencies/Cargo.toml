[package]
name = "droutex-dns-client-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[dependencies]
hickory-net = { version = "=0.26.3", default-features = false, features = ["tokio"] }
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }

[[test]]
name = "qualification"
path = "qualification.rs"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
