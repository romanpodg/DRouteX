[package]
name = "routira-sqlite-qualification"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
publish = false

[workspace]

[patch.crates-io]
sqlx-sqlite = { path = "../../vendor/sqlx-sqlite" }

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread", "sync", "time"] }

[[test]]
name = "qualification"
path = "qualification.rs"
