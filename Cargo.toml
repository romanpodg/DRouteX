[workspace]
resolver = "3"
members = ["crates/veyra-policy", "crates/veyra-dns", "crates/veyra-gateway", "apps/veyra-cli", "apps/veyra-dataplane"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
veyra-policy = { path = "crates/veyra-policy" }
veyra-dns = { path = "crates/veyra-dns" }
veyra-gateway = { path = "crates/veyra-gateway" }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.154"
idna = "1.1.0"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
