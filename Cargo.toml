[workspace]
members = ["crates/droutex-common", "crates/droutex-config", "crates/droutex-policy", "crates/droutex-storage", "crates/droutex-security"]
exclude = ["vendor/sqlx-sqlite"]
resolver = "3"

[patch.crates-io]
sqlx-sqlite = { path = "vendor/sqlx-sqlite" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
uuid = "=1.28.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
serde_path_to_error = "=0.1.20"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
droutex-common = { path = "crates/droutex-common", version = "=0.1.0" }
droutex-config = { path = "crates/droutex-config", version = "=0.1.0" }
droutex-policy = { path = "crates/droutex-policy", version = "=0.1.0" }
droutex-security = { path = "crates/droutex-security", version = "=0.1.0" }
aws-lc-rs = { version = "=1.18.2", default-features = false, features = ["non-fips", "alloc", "prebuilt-nasm"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
