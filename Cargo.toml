[workspace]
members = ["crates/routira-common", "crates/routira-config", "crates/routira-policy"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
uuid = "=1.28.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
serde_path_to_error = "=0.1.20"
routira-common = { path = "crates/routira-common", version = "=0.1.0" }
routira-policy = { path = "crates/routira-policy", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
