apiVersion: veyra.io/v1alpha1
kind: PolicyBundle
metadata: { name: warn }
spec:
  profiles: [{ id: home }]
  rules:
    - { id: a, scope: default, match: { domains: ["*.x.example"] }, action: { type: block } }
    - { id: b, scope: default, match: { domains: ["suffix:x.example"] }, action: { type: direct } }
